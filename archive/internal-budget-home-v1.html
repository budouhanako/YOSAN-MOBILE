<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>内部予算執行</title>
  <style>
    :root{--purple:#8d79bd;--light:#c8b8ed;--ink:#2f2b38;--line:#ddd8e8;--bg:#fbfaff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;background:#ececef;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:var(--ink)}
    button,select{font:inherit}.phone{position:relative;width:min(100%,430px);height:100vh;height:100dvh;padding-bottom:52px;overflow:hidden;background:radial-gradient(circle at -8% 72%,#ded5f1 0 118px,transparent 119px),linear-gradient(180deg,#faf8ff 0%,#f3effb 52%,#ebe5f7 100%)}.phone.list-active{background:#f5f5f7}
    .content{height:100%;padding:12px 22px 64px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.topbar{height:48px;margin:0 -10px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;background:var(--purple)}
    .topbar h1{margin:0;font-size:18px;font-weight:500}.menu{display:grid;grid-template-columns:repeat(3,4px);gap:3px}.menu i{width:4px;height:4px;background:#fff}.header-actions{display:flex;align-items:center;gap:5px}.search-button,.gear{width:32px;height:32px;padding:0;border:0;background:none;color:#fff;cursor:pointer;display:grid;place-items:center;line-height:1}.search-button[hidden]{display:none}.search-button svg,.gear svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.search-button{position:relative}.search-button.filtered:after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border:2px solid #8d79bd;border-radius:50%;background:#76c7a5}.view{display:none}.view.active{display:block}
    .account-menu{position:absolute;z-index:30;top:66px;right:22px;width:224px;border-radius:8px;background:#fff;box-shadow:0 8px 24px rgba(53,45,71,.2);overflow:hidden}.account-menu[hidden]{display:none}.account-head{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;background:#faf9fd}.account-head strong,.account-head small{display:block}.account-head strong{font-size:14px}.account-head small{margin-top:4px;color:#777080;font-size:12px}.account-photo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e9e3f7;color:#8d79bd;font-size:22px}.logout{width:calc(100% - 28px);height:38px;margin:10px 14px 14px;border:0;border-radius:20px;background:#8d79bd;color:#fff;font-weight:700;cursor:pointer}.size-row{width:100%;height:50px;padding:0 14px;border:0;border-top:1px solid #eeeaf3;background:#fff;display:flex;align-items:center;justify-content:space-between;text-align:left}.size-row span{color:#aaa3b3;font-size:20px}
    .search-panel{position:absolute;z-index:40;inset:0;background:#f5f5f7;display:flex;flex-direction:column}.search-panel[hidden]{display:none}.search-head{flex:0 0 52px;padding:0 12px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;color:#fff;background:linear-gradient(100deg,#7663a9,#a997d4)}.search-head h2{margin:0;text-align:center;font-size:16px}.search-back,.search-close{height:32px;border:0;background:transparent;color:#fff}.search-back{justify-self:start;padding:0 5px;font-size:12px;font-weight:600}.search-close{justify-self:end;width:32px;font-size:22px}.search-form{flex:1;overflow:auto;padding:18px 22px 58px}.search-fields{display:grid;gap:12px}.search-field{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:8px}.search-field label{font-size:12px;font-weight:600;color:#514b5d}.search-field input,.search-field select{width:100%;height:36px;padding:0 9px;border:1px solid #c8c2d0;border-radius:5px;background:#fff;color:#3e3947;font-size:12px}.search-actions{position:absolute;left:0;right:0;bottom:0;height:46px;padding:6px 18px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:7px;border-top:1px solid #ded9e5;background:#fff}.search-actions button{border:1px solid #bdb5cc;border-radius:5px;background:#fff;color:#554e62;font-size:11px;font-weight:600}.search-actions .apply{border-color:#8d79bd;background:#8d79bd;color:#fff}
    .profile{height:96px;margin:18px 24px 0;padding:14px 18px;display:flex;align-items:center;gap:16px;border-radius:9px;color:#fff;background:radial-gradient(circle at 106% 52%,transparent 0 47px,rgba(255,255,255,.14) 48px 74px,transparent 75px 94px,rgba(255,255,255,.1) 95px 121px,transparent 122px),linear-gradient(110deg,#9d84d0,#c8b8ed);overflow:hidden;position:relative}
    .avatar{position:relative;z-index:1;width:62px;height:62px;border-radius:50%;background:#fff}.avatar:before{content:"";position:absolute;left:50%;top:12px;width:20px;height:20px;transform:translateX(-50%);border-radius:50%;background:#9b99a1}.avatar:after{content:"";position:absolute;left:50%;bottom:10px;width:34px;height:20px;transform:translateX(-50%);border-radius:18px 18px 9px 9px;background:#9b99a1}.name{position:relative;z-index:1;font-size:17px;font-weight:600}
    .entry-grid{margin:46px 10px 0;display:grid;gap:15px}.entry{min-height:94px;padding:16px 18px 16px 22px;border:0;border-radius:10px;background:#fff;box-shadow:0 4px 12px rgba(77,68,97,.18);display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;cursor:pointer}.entry-copy{min-width:0;flex:1}.entry strong{display:block;font-size:18px;font-weight:700;line-height:1.35;color:#5e4b91}.entry small{display:block;margin-top:7px;color:#81798e;font-size:12px;line-height:1.45}.entry-icon{flex:0 0 58px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:28px}.e1 .entry-icon{background:#f6bd45}.e2 .entry-icon{background:#947fd6}.e3 .entry-icon{background:#68a8ec}.e4 .entry-icon{background:#63b99d}
    .filters{margin-top:20px;padding:0;border:0;background:transparent}.filter-field{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:3px}.filter-field label{font-size:13px;font-weight:600;color:#554c6b}.filter-field select{width:100%;height:34px;padding:0 9px;border:1px solid #aaa2ba;background:#fff;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;overflow:hidden}.chip{padding:5px 9px;white-space:nowrap;border:1px solid #c1b7d8;border-radius:12px;background:#fff;font-size:11px}.chip.active{color:#7057a6;background:#ddd3f3;border-color:#cbbce9;font-weight:600}.month{width:100%;margin-top:10px;padding:4px 3px;border:0;background:transparent;color:#111;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.month-label{height:24px;display:flex;align-items:center;line-height:24px}.month-count{color:#65aeda}.month-arrow{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:0;line-height:0;transition:transform .2s}.month-arrow:before{content:"";width:7px;height:7px;border-right:2px solid #514b59;border-bottom:2px solid #514b59;transform:rotate(45deg) translate(-1px,-1px)}.month-group.collapsed .month-arrow{transform:rotate(-90deg)}.month-group.collapsed .row{display:none}.row{min-height:74px;margin-top:5px;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;border:1px solid #e2dee8;border-radius:6px;background:#fff;box-shadow:0 2px 6px rgba(68,59,82,.08)}.row strong{display:block;font-size:12px;font-weight:500;color:#55505d}.row small{display:block;margin-top:7px;color:#77717e;font-size:12px;font-weight:400}.state{flex:0 0 auto;margin-left:10px;padding:5px 9px;border-radius:12px;white-space:nowrap;font-size:10px;font-weight:700}.state-input{color:#5f6570;background:#eceef1}.state-applying{color:#1767a7;background:#dceeff}.state-approved{color:#24744f;background:#ddf3e8}.state-voucher{color:#6b4c9a;background:#eadff8}.state-cancel{color:#a2532e;background:#ffeadc}
    .applied-conditions{margin-top:10px;padding:9px 10px;border:1px dashed #bdaedb;border-left:4px solid #8d79bd;border-radius:5px;background:#f1ecfa}.applied-conditions[hidden]{display:none}.applied-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;color:#5d5271;font-size:11px;font-weight:700}.clear-conditions{border:0;background:transparent;color:#7763a8;font-size:10px;text-decoration:underline}.condition-list{display:flex;flex-wrap:wrap;gap:5px}.condition-tag{padding:4px 7px;border:1px solid #d6c9ec;border-radius:10px;background:#fff;color:#66528f;font-size:10px}
    .nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ddd8e6;background:#fff}.nav button{border:0;background:#fff;color:#9992a5;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}.nav button.active{color:#fff;background:var(--purple);font-weight:700}.nav span{display:inline-block;margin:0;font-size:17px;line-height:1}
    @media(min-width:600px){body{padding:18px 0}.phone{height:min(828px,calc(100vh - 36px));box-shadow:0 8px 30px #b9b7c3}}
    @media(max-height:720px){.content{padding-top:8px}.topbar{height:42px}.topbar h1{font-size:16px}.profile{height:78px;margin-top:12px}.avatar{transform:scale(.86)}.entry-grid{margin-top:24px;gap:10px}.entry{min-height:78px;padding-top:10px;padding-bottom:10px}.entry-icon{width:48px;height:48px;flex-basis:48px;font-size:23px}.entry strong{font-size:16px}.entry small{margin-top:4px}.filters{margin-top:13px}.month{margin-top:6px}.row{min-height:64px;padding-top:8px;padding-bottom:8px}.nav{height:46px}.phone{padding-bottom:46px}.content{padding-bottom:56px}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="content">
      <header class="topbar"><span class="menu" aria-label="メニュー"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><h1>Murphy検証用（会計）</h1><div class="header-actions"><button class="search-button" id="searchButton" title="詳細検索" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg></button><button class="gear" id="accountButton" title="アカウント" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path></svg></button></div></header>
      <div class="account-menu" id="accountMenu" hidden><div class="account-head"><div><strong>馬 嘉瑶</strong><small>内部予算執行</small></div><div class="account-photo">●</div></div><button class="logout" id="logoutButton">ログアウト</button><button class="size-row">サイズを調整<span>›</span></button></div>
      <section id="home" class="view active">
        <div class="profile"><div class="avatar" aria-label="ユーザー画像"></div><div class="name">馬 嘉瑶</div></div>
        <div class="entry-grid">
          <button class="entry e1" data-name="執行伺入力"><span class="entry-copy"><strong>執行伺入力</strong><small>予算執行の伺書を新規作成します</small></span><span class="entry-icon">＋</span></button>
          <button class="entry e2" data-name="入出金入力"><span class="entry-copy"><strong>入出金入力</strong><small>入金・出金に関するデータを登録します</small></span><span class="entry-icon">￥</span></button>
          <button class="entry e3" data-name="旅費申請入力"><span class="entry-copy"><strong>旅費申請入力</strong><small>出張前の旅費申請を作成します</small></span><span class="entry-icon">▤</span></button>
          <button class="entry e4" data-name="旅費精算入力"><span class="entry-copy"><strong>旅費精算入力</strong><small>出張後の旅費精算を登録します</small></span><span class="entry-icon">✓</span></button>
        </div>
      </section>
      <section id="list" class="view">
        <div class="filters"><div class="filter-field"><label for="formSelect">様式名</label><select id="formSelect"><option value=""></option><option>出張申請中高生用</option><option>出張申請一般用</option><option>その他...</option></select></div><div class="chips"><button class="chip active" data-filter="all">すべて</button><button class="chip active" data-filter="execution">執行伺</button><button class="chip active" data-filter="payment">入出金伺</button><button class="chip active" data-filter="travel-request">旅費申請</button><button class="chip active" data-filter="travel-settlement">旅費精算</button></div></div><div class="applied-conditions" id="appliedConditions" hidden><div class="applied-head"><span>適用中の条件</span><button class="clear-conditions" id="clearConditions">すべてクリア</button></div><div class="condition-list" id="conditionList"></div></div>
        <section class="month-group"><button class="month" aria-expanded="true"><span class="month-label">2026年8月（<span class="month-count">2件</span>）</span><span class="month-arrow">⌄</span></button><div class="row" data-type="execution"><div><strong>申請番号：00000016</strong><small>件名：新学期　新人研究員研修費用</small></div><span class="state state-input">入力中</span></div><div class="row" data-type="payment"><div><strong>申請番号：00000015</strong><small>件名：研究設備購入費用</small></div><span class="state state-applying">申請中</span></div></section>
        <section class="month-group"><button class="month" aria-expanded="true"><span class="month-label">2026年7月（<span class="month-count">2件</span>）</span><span class="month-arrow">⌄</span></button><div class="row" data-type="travel-request"><div><strong>申請番号：00000013</strong><small>件名：東京地区研究会出張申請</small></div><span class="state state-approved">承認済</span></div><div class="row" data-type="travel-settlement"><div><strong>申請番号：00000012</strong><small>件名：大阪研修会旅費精算</small></div><span class="state state-voucher">伝票生成済</span></div></section>
      </section>
    </div>
    <nav class="nav"><button class="active" data-view="home"><span>⌂</span>ホーム</button><button data-view="list"><span>▤</span>データ一覧</button><button><span>✓</span>電子承認</button></nav>
    <section class="search-panel" id="searchPanel" hidden><header class="search-head"><button class="search-back" id="searchBack">‹ 戻る</button><h2>詳細検索条件</h2><button class="search-close" id="searchClose" title="閉じる">×</button></header><form class="search-form" id="searchForm"><div class="search-fields"><div class="search-field"><label for="fiscalYear">年度</label><select id="fiscalYear"><option value=""></option><option>2026年度</option><option>2025年度</option></select></div><div class="search-field"><label for="searchDate">日付</label><input id="searchDate" type="date"></div><div class="search-field"><label for="searchStatus">状態</label><select id="searchStatus"><option value=""></option><option>入力中</option><option>申請中</option><option>承認済</option><option>承認取消中</option><option>購入稟議作成済</option><option>伝票生成済</option><option>伝票生成不要</option></select></div><div class="search-field"><label for="office">部所</label><input id="office" type="text"></div><div class="search-field"><label for="purpose">目的</label><input id="purpose" type="text"></div><div class="search-field"><label for="department">部門</label><input id="department" type="text"></div><div class="search-field"><label for="payee">支払先</label><input id="payee" type="text"></div><div class="search-field"><label for="operator">入力者</label><input id="operator" type="text"></div><div class="search-field"><label for="tag">付箋</label><input id="tag" type="text"></div><div class="search-field"><label for="reason">執行理由・件名</label><input id="reason" type="text"></div><div class="search-field"><label for="travelDate">出張日付</label><input id="travelDate" type="date"></div><div class="search-field"><label for="content">内容</label><input id="content" type="text"></div><div class="search-field"><label for="approvalStatus">電子承認（状態）</label><select id="approvalStatus"><option value=""></option><option>未申請</option><option>承認待ち</option><option>承認済</option><option>差戻し</option></select></div><div class="search-field"><label for="applicant">申請者（電子承認）</label><input id="applicant" type="text"></div></div></form><div class="search-actions"><button class="apply" id="searchApply" type="button">適用</button><button id="searchReset" type="button">リセット</button><button id="searchCancel" type="button">キャンセル</button></div></section>
  </main>
  <script>
    document.querySelectorAll('.nav button[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.view').forEach(view=>view.classList.remove('active'));document.getElementById(button.dataset.view).classList.add('active');document.querySelectorAll('.nav button').forEach(item=>item.classList.remove('active'));button.classList.add('active');const isList=button.dataset.view==='list';document.querySelector('.phone').classList.toggle('list-active',isList);document.getElementById('searchButton').hidden=!isList;if(!isList)setSearchOpen(false)}));
    const chips=[...document.querySelectorAll('.chip')];const allChip=document.querySelector('[data-filter="all"]');const typeChips=chips.filter(chip=>chip.dataset.filter!=='all');function filterRows(){const selected=new Set(typeChips.filter(chip=>chip.classList.contains('active')).map(chip=>chip.dataset.filter));document.querySelectorAll('.row[data-type]').forEach(row=>row.hidden=!selected.has(row.dataset.type));document.querySelectorAll('.month-group').forEach(group=>{const count=[...group.querySelectorAll('.row[data-type]')].filter(row=>!row.hidden).length;group.querySelector('.month-count').textContent=count+'件';group.hidden=count===0});allChip.classList.toggle('active',selected.size===typeChips.length)}chips.forEach(chip=>chip.addEventListener('click',()=>{if(chip===allChip){const turnOn=!typeChips.every(item=>item.classList.contains('active'));typeChips.forEach(item=>item.classList.toggle('active',turnOn))}else{chip.classList.toggle('active')}filterRows()}));document.querySelectorAll('.month').forEach(month=>month.addEventListener('click',()=>{const group=month.closest('.month-group');group.classList.toggle('collapsed');month.setAttribute('aria-expanded',String(!group.classList.contains('collapsed')))}));filterRows();
    const accountButton=document.getElementById('accountButton');const accountMenu=document.getElementById('accountMenu');accountButton.addEventListener('click',event=>{event.stopPropagation();accountMenu.hidden=!accountMenu.hidden;accountButton.setAttribute('aria-expanded',String(!accountMenu.hidden))});document.addEventListener('click',event=>{if(!accountMenu.contains(event.target)){accountMenu.hidden=true;accountButton.setAttribute('aria-expanded','false')}});document.getElementById('logoutButton').addEventListener('click',()=>{if(confirm('ログアウトしますか？')){accountMenu.hidden=true;alert('ログアウトしました。')}});
    const searchButton=document.getElementById('searchButton');const searchPanel=document.getElementById('searchPanel');const searchForm=document.getElementById('searchForm');const appliedConditions=document.getElementById('appliedConditions');const conditionList=document.getElementById('conditionList');function setSearchOpen(open){searchPanel.hidden=!open;searchButton.setAttribute('aria-expanded',String(open))}function updateConditionDisplay(){const conditions=[...searchForm.querySelectorAll('input,select')].filter(field=>field.value.trim()!=='').map(field=>({label:searchForm.querySelector('label[for="'+field.id+'"]').textContent,value:field.options?field.options[field.selectedIndex].text:field.value}));conditionList.replaceChildren(...conditions.map(condition=>{const tag=document.createElement('span');tag.className='condition-tag';tag.textContent=condition.label+'：'+condition.value;return tag}));appliedConditions.hidden=conditions.length===0;searchButton.classList.toggle('filtered',conditions.length>0)}function clearDetailedConditions(){searchForm.reset();updateConditionDisplay()}searchButton.addEventListener('click',()=>setSearchOpen(true));document.getElementById('searchBack').addEventListener('click',()=>setSearchOpen(false));document.getElementById('searchClose').addEventListener('click',()=>setSearchOpen(false));document.getElementById('searchCancel').addEventListener('click',()=>setSearchOpen(false));document.getElementById('searchReset').addEventListener('click',clearDetailedConditions);document.getElementById('clearConditions').addEventListener('click',clearDetailedConditions);document.getElementById('searchApply').addEventListener('click',()=>{updateConditionDisplay();setSearchOpen(false)});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!searchPanel.hidden)setSearchOpen(false)});
  </script>
</body>
</html>
