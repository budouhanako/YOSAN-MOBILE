    const frame=document.getElementById('prototype');
    let loggedIn=false,lastHomeView='home';
    function validPage(value){return Object.prototype.hasOwnProperty.call(pages,value)?value:'home'}
    function pageFromHash(){return validPage(location.hash.slice(1))}
    function showPage(page){
      const target=validPage(page);
      frame.onload=()=>{if(target==='home')frame.contentWindow.postMessage({type:'restore-home-state',loggedIn,view:lastHomeView},'*')};
      frame.src='data:text/html;charset=utf-8;base64,'+pages[target];
      if(location.hash!=='#'+target)history.replaceState(null,'','#'+target);
    }
    addEventListener('message',event=>{
      if(event.source!==frame.contentWindow||!event.data)return;
      if(event.data.type==='auth-change')loggedIn=Boolean(event.data.loggedIn);
      if(event.data.type==='home-view-change')lastHomeView=event.data.view||'home';
      if(event.data.type==='navigate')showPage(event.data.page);
    });
    addEventListener('hashchange',()=>showPage(pageFromHash()));
    showPage(pageFromHash());
  </script>
